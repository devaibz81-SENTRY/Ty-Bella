<script>
var lbPhotos=[],lbIndex=0,lbCaptions={};
lbCaptions["Photos/Photo galery (1).jpg"]={title:"Our Beginning",desc:"Where it all started"};
lbCaptions["Photos/Photo galery (2).jpg"]={title:"Together Forever",desc:"Every moment counts"};
lbCaptions["Photos/Photo galery (3).jpg"]={title:"Adventures",desc:"Exploring the world hand in hand"};
lbCaptions["Photos/Photo galery (4).jpg"]={title:"Pure Joy",desc:"Laughter and love"};
lbCaptions["Photos/Photo galery (5).jpg"]={title:"Growing Together",desc:"Building our future"};
lbCaptions["Photos/Photo galery (6).jpg"]={title:"The Proposal",desc:"A moment to remember forever"};
lbCaptions["Photos/cork steet.jpg"]={title:"The Venue",desc:"19 Cork Street, Belize City"};
lbCaptions["Photos/cork steet.png"]={title:"The Venue",desc:"Where we'll say I do"};
function openLightbox(src){initLb();var i=lbPhotos.indexOf(src);if(i===-1){lbPhotos.push(src);i=lbPhotos.length-1}lbIndex=i;showLbImg();document.getElementById('lightbox').classList.add('active');document.body.style.overflow='hidden'}
function lbClose(e){if(e)e.stopPropagation();document.getElementById('lightbox').classList.remove('active');document.body.style.overflow=''}
function lbPrev(e){if(e)e.stopPropagation();lbIndex--;showLbImg()}
function lbNext(e){if(e)e.stopPropagation();lbIndex++;showLbImg()}
function initLb(){if(lbPhotos.length)return;var imgs=document.querySelectorAll('.gallery-item');lbPhotos=[];imgs.forEach(function(el){var m=el.getAttribute('onclick');if(m){var r=m.match(/openLightbox\('([^']+)'\)/);if(r)lbPhotos.push(r[1])}})}
function showLbImg(){var img=document.getElementById('lb-img');var i=((lbIndex%lbPhotos.length)+lbPhotos.length)%lbPhotos.length;var src=lbPhotos[i];img.style.opacity='0';img.style.transform='scale(0.95)';setTimeout(function(){img.src=src;img.style.opacity='1';img.style.transform='scale(1)'},60);updateLbDots(i);document.getElementById('lb-counter').textContent=(i+1)+' / '+lbPhotos.length;var cap=lbCaptions[src];document.getElementById('lb-cap-title').textContent=cap?cap.title:'';document.getElementById('lb-cap-desc').textContent=cap?cap.desc:''}
function updateLbDots(i){var c=document.getElementById('lb-dots');c.innerHTML='';for(var j=0;j<lbPhotos.length;j++){var d=document.createElement('span');if(j===i)d.className='active';d.setAttribute('data-idx',j);d.onclick=function(e){e.stopPropagation();lbIndex=parseInt(this.getAttribute('data-idx'));showLbImg()};c.appendChild(d)}}
var lbTouchX=0;document.getElementById('lightbox').addEventListener('touchstart',function(e){lbTouchX=e.changedTouches[0].screenX},{passive:true});document.getElementById('lightbox').addEventListener('touchend',function(e){var diff=lbTouchX-e.changedTouches[0].screenX;if(Math.abs(diff)>50){if(diff>0)lbNext();else lbPrev()}},{passive:true});
document.addEventListener('keydown',function(e){if(!document.getElementById('lightbox').classList.contains('active')){if(e.key==='Escape')closeVideoOverlay();return}if(e.key==='Escape')lbClose();if(e.key==='ArrowRight')lbNext();if(e.key==='ArrowLeft')lbPrev()});
function openVideoOverlay(){document.getElementById('video-overlay').style.display='flex';var v=document.getElementById('proposal-video');v.load();v.play().catch(function(){})}
function closeVideoOverlay(){var v=document.getElementById('proposal-video');v.pause();v.currentTime=0;document.getElementById('video-overlay').style.display='none'}
</script>
