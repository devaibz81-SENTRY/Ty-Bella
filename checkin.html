<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Check-In — Isabella & Tyler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#c9a84c;--black:#0d0d0d;--ivory:#f5f0e8;--green:#2ecc71}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:var(--ivory);font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.container{max-width:500px;width:100%;padding:2rem 1.5rem;text-align:center}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);color:var(--gold);margin-bottom:.5rem}
.subtitle{color:rgba(255,255,255,.4);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:2rem}
.search-box{display:flex;gap:.5rem;margin-bottom:2rem}
.search-box input{flex:1;background:#222;border:1px solid var(--gold);border-radius:8px;padding:1rem;color:#fff;font-family:'Montserrat',sans-serif;font-size:1rem}
.search-box input::placeholder{color:#666}
.search-box button{background:var(--gold);color:#000;border:none;padding:1rem 1.5rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:1rem}
.result{display:none;animation:fadeIn .3s ease}
.result.show{display:block}
.guest-card{background:#111;border:1px solid rgba(201,168,76,.2);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.guest-name{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--ivory)}
.guest-table{font-size:.8rem;color:var(--gold);margin-top:.3rem}
.checkin-status{margin-top:1rem;padding:.8rem;border-radius:8px;font-size:.8rem}
.checkin-status.checked{background:rgba(46,204,113,.15);color:var(--green);border:1px solid rgba(46,204,113,.3)}
.checkin-status.pending{background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1)}
.checkin-btn{padding:.8rem 2rem;background:var(--gold);color:#000;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;margin-top:1rem;transition:all .2s}
.checkin-btn:hover{opacity:.9}
.checkin-btn:disabled{opacity:.4;cursor:default}
.error{color:#e74c3c;text-align:center;padding:1rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="container">
<h1>Guest Check-In</h1>
<p class="subtitle">Find your name and check in</p>
<div class="search-box">
<input type="text" id="search" placeholder="Search your name..." onkeydown="if(event.key==='Enter') searchGuest()"/>
<button onclick="searchGuest()">Find</button>
</div>
<div class="result" id="result"></div>
</div>
<script>
const CONVEX_URL='https://adept-bat-233.convex.site';
function searchGuest(){
var query=document.getElementById('search').value.trim();
var el=document.getElementById('result');
if(!query){el.innerHTML='<div class="error">Enter a name to search</div>';el.classList.add('show');return;}
el.innerHTML='<div style="padding:1rem;color:rgba(255,255,255,.4)">Searching...</div>';el.classList.add('show');
fetch(CONVEX_URL+'/api/checkin/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:query})}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(matches){
if(!matches||!matches.length){el.innerHTML='<div class="error">Guest not found. Try a different spelling.</div>';return;}
var match=matches[0];
el.innerHTML='<div class="guest-card"><div class="guest-name">'+escapeHtml(match.first_name+' '+match.last_name)+'</div><div class="checkin-status '+(match.checked_in?'checked':'pending')+'">'+(match.checked_in?'Checked In ✓':'Not Yet Checked In')+'</div>'+(match.checked_in?'':'<button class="checkin-btn" onclick="doCheckin(\''+escapeHtml(match._id)+'\')">CHECK IN</button>')+'</div>';
}).catch(function(){el.innerHTML='<div class="error">Could not connect. Please try again later.</div>'});
}
function doCheckin(guestId){
var el=document.getElementById('result');
el.innerHTML='<div style="padding:1rem;color:rgba(255,255,255,.4)">Checking in...</div>';
fetch(CONVEX_URL+'/api/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guestId:guestId})}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(data){searchGuest()}).catch(function(){el.innerHTML='<div class="error">Check-in failed. Please try again.</div>'});
}
function escapeHtml(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
