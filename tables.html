  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    .search-box { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .search-box input { flex: 1; background: #222; border: 1px solid #d4af37; border-radius: 8px; padding: 1rem; color: #fff; font-family: 'Montserrat', sans-serif; font-size: 1rem; }
    .search-box input::placeholder { color: #666; }
    .search-box button { background: #d4af37; color: #000; border: none; padding: 1rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; }
    .result { display: none; animation: fadeIn 0.3s ease; }
    .result.show { display: block; }
    .table-number { font-size: 4rem; font-weight: 700; color: #d4af37; margin: 1rem 0; }
    .table-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: #888; }
    .your-name { font-family: 'Great Vibes', cursive; font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
    .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; color: #d4af37; margin: 2rem 0 1rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
    .guest-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .guest-item { background: #111; padding: 0.8rem 1rem; border-radius: 8px; border-left: 3px solid #d4af37; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
    .guest-item.highlight { background: #1a1a0a; border-left-color: #fff; color: #d4af37; font-weight: 600; }
    .loading { text-align: center; padding: 2rem; color: #888; }
    .error { color: #e74c3c; text-align: center; padding: 1rem; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    nav { display: flex; justify-content: center; gap: 0.6rem; padding: 1rem; flex-wrap: wrap; }
    nav a { color: #FFFFF0; text-decoration: none; opacity: 0.8; border: 1px solid rgba(255,255,240,0.2); border-radius: 999px; padding: 0.5rem 0.9rem; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; }
    nav a:hover { opacity: 1; border-color: #d4af37; }
  </style>
  <script>
    if(performance.navigation.type===1||performance.getEntriesByType("navigation")[0].type==="reload"){
    window.location.href="index.html";
    }
  </script>
</head>
<body>
  <nav>
    <a href="index.html">Invitation</a>

  <div class="container">
    <h1>Find Your Table</h1>
    <p class="subtitle">Search your name to find your table assignment</p>
    
    <div class="search-box">
      <input type="text" id="search-name" placeholder="Your name..." onkeydown="if(event.key==='Enter') searchTable()" />
      <button onclick="searchTable()">Find</button>
    </div>
    
    <div class="result" id="result">
      <div id="result-content"></div>
    </div>
  </div>

  <script>
    const CONVEX_URL='https://hip-donkey-513.convex.site';
    let cachedData = null;
    const FALLBACK_SEATING = [{"guestName":"Ivana DePaz","guestId":"j971wzcxajdvrayrgg81wr8ws182pe6s","tableNum":"1"},{"guestName":"Joaquin DePaz","guestId":"j97bn3q7ap3myf1xeag011pds182ppvj","tableNum":"1"},{"guestName":"Diana","guestId":"j979s035s6zgj88fdt403e27xx867ej7","tableNum":"1"},{"guestName":"Vana","guestId":"j97a67wxycmvv0fcsanpn09wfx866msf","tableNum":"1"},{"guestName":"Yasmini Matus","guestId":"j975fr1n1g0m6rf2f7pnm93gbx82p3f8","tableNum":"1"},{"guestName":"Jean Harrison","guestId":"j979zc0cgddthkax8r4svs7dk98804qq","tableNum":"1"},{"guestName":"Sian DePaz","guestId":"j970rzr4hjcr4e5gkb4n03zhvh82p25p","tableNum":"2"},{"guestName":"Mathew Preston","guestId":"j974a42bkvtsgkb3xfprx33tm187mc8r","tableNum":"2"},{"guestName":"Josue","guestId":"j978k6wxfzj068k2t29bv4684h87nw0s","tableNum":"2"},{"guestName":"Maleek","guestId":"j973nssdwp0jk8kc676d39r3d183jd03","tableNum":"2"},{"guestName":"Devin Peyrefitte","guestId":"j9728weej33q8w9z4drq3zt4wh82ps9d","tableNum":"2"},{"guestName":"Yojalma Moleterno","guestId":"j970q38r7drywmfak3w78q4rkn83k0xt","tableNum":"2"},{"guestName":"Carlitos Guest","guestId":"j974eyfw4nd20tsb6y98sdwsnh83nb5y","tableNum":"2"},{"guestName":"Jose DePaz","guestId":"j9779nj6rm2evfk2mshprdmbxx82qsmd","tableNum":"3"},{"guestName":"Mr. Mike Gonzalez","guestId":"j976r18cn1d4spx64nxefwdaq983k46s","tableNum":"3"},{"guestName":"Ingrid Gonzalez","guestId":"j975ts0zvb15sp3hfjat223zt983k5c3","tableNum":"3"},{"guestName":"Aldo DePaz","guestId":"j97aj0dy6h9p02672ba7bxk3qs82qtz5","tableNum":"3"},{"guestName":"Keisha Dwyer","guestId":"j9748he50px1603j46x3yk5yxh83j2zr","tableNum":"3"},{"guestName":"Ms. Marie DePaz","guestId":"j978xes1ygrzmsgyjny5akpb8x82pbq9","tableNum":"3"},{"guestName":"Lily Lane","guestId":"j972v6mnprgccewr4hwpfn5adn82p58b","tableNum":"3"},{"guestName":"Lucille Valladarez","guestId":"j97a2dx1b52gc2vbjg1smjzejh82qv64","tableNum":"4"},{"guestName":"Norberto DePaz","guestId":"j973n8avtrmnksns4fv09rzssh86511r","tableNum":"4"},{"guestName":"D... (line truncated to 2000 chars)
    cachedData = FALLBACK_SEATING;

    async function searchTable() {
      const query = document.getElementById('search-name').value.trim().toLowerCase();
      const el = document.getElementById('result');
      const content = document.getElementById('result-content');
      if (!query) { content.innerHTML = '<div class="error">Please enter your name</div>'; el.classList.add('show'); return; }
      if (!cachedData) await loadTableData();
      const matches = cachedData.filter(s => {
        const name = (s.guestName || s.name || '').toLowerCase();
        return name.includes(query);
      });
      
      if (!matches.length) {
        content.innerHTML = '<div class="error">No table found for this name. Check spelling or try a different search.</div>';
        el.classList.add('show');
        return;
      }
      
      const guest = matches[0];
      const tableNum = guest.content || guest.tableNum || '';
      const tableGuests = cachedData.filter(s => (s.content || s.tableNum) === tableNum && s.guestName !== guest.guestName);
      const guestName = guest.guestName || guest.name || '';
      
      content.innerHTML = `
        <div class="your-name">${escapeHtml(guestName)}</div>
        <div class="table-label">Your Table</div>
        <div class="table-number">${escapeHtml(tableNum)}</div>
        ${tableGuests.length ? `
          <div class="section-title">Seated at Your Table</div>
          <div class="guest-list">
            ${tableGuests.map(g => `<div class="guest-item">${escapeHtml(g.guestName || g.name || '')}</div>`).join('')}
          </div>
        ` : '<div style="margin-top:2rem;color:#888;">You\'re the only one at this table.</div>'}
      `;
      
      el.classList.add('show');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadTableData() {
      try {
        const res = await fetch(CONVEX_URL+'/api/seating');
        if (res.ok) {
          const data = await res.json();
          const guestsRes = await fetch(CONVEX_URL+'/api/guests');
          if (guestsRes.ok) {
            const guests = await guestsRes.json();
            cachedData = data.map(s => {
              const g = guests.find(x => x._id.toString() === s.guest_id);
              return { guestId: s.guest_id, guestName: g ? `${g.first_name} ${g.last_name}`.trim() : 'Guest', tableNum: s.table_num };
            });
            return;
          }
        }
      } catch {}
      cachedData = FALLBACK_SEATING;
    }
    loadTableData();
  </script>
</body>
</html>
