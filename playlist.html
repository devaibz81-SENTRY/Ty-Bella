<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Playlist — Isabella & Tyler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#c9a84c;--black:#0d0d0d;--ivory:#f5f0e8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0d;color:var(--ivory);font-family:'Montserrat',sans-serif;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:2rem 1.5rem}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);color:var(--gold);text-align:center;margin-bottom:.5rem}
.subtitle{text-align:center;color:rgba(255,255,255,.4);font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:3rem}
.song-card{background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.15);border-radius:12px;padding:1.2rem 1.5rem;margin-bottom:.8rem;display:flex;align-items:center;gap:1rem;transition:all .2s}
.song-card:hover{background:rgba(255,255,255,.06);border-color:rgba(201,168,76,.3)}
.song-num{font-size:.7rem;color:rgba(255,255,255,.2);min-width:28px;font-weight:500}
.song-info{flex:1}
.song-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--ivory)}
.song-artist{font-size:.75rem;color:rgba(255,255,240,.5);margin-top:.15rem}
.song-name{font-size:.7rem;color:var(--gold);text-align:right;min-width:80px}
.empty-state{text-align:center;padding:4rem 2rem;color:rgba(255,255,255,.3)}
.empty-state span{font-size:3rem;display:block;margin-bottom:1rem}
nav{display:flex;justify-content:center;gap:.6rem;padding:1rem;flex-wrap:wrap}
nav a{color:#FFFFF0;text-decoration:none;opacity:.8;border:1px solid rgba(255,255,240,.2);border-radius:999px;padding:.5rem .9rem;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;transition:all .2s}
nav a:hover{opacity:1;border-color:var(--gold)}
</style>
</head>
<body>
<nav>
<a href="index.html">Invitation</a>
<a href="rsvp.html">RSVP</a>
<a href="songs.html">Song Request</a>
<a href="messages.html">Messages</a>
<a href="admin.html">Admin</a>
</nav>
<div class="container">
<h1>Wedding Playlist</h1>
<p class="subtitle">Songs requested by our guests</p>
<div id="playlist">
<div class="empty-state">
<span>🎵</span>
<p>No song requests yet. Share the song request page with your guests!</p>
</div>
</div>
</div>
<script>
const CONVEX_URL='https://wary-lark-534.convex.site';
const STORAGE_KEY='it_songs';
var el=document.getElementById('playlist');
function renderSongs(songs){
if(!songs||!songs.length){
el.innerHTML='<div class="empty-state"><span>🎵</span><p>No song requests yet. Share the song request page with your guests!</p></div>';
return;
}
el.innerHTML=songs.map(function(s,i){
var title=s.song||s.title||'';
var artist=s.artist||'';
var name=s.name||'';
return '<div class="song-card"><div class="song-num">'+(i+1)+'</div><div class="song-info"><div class="song-title">'+escapeHtml(title)+'</div><div class="song-artist">'+escapeHtml(artist)+'</div></div><div class="song-name">'+escapeHtml(name)+'</div></div>';
}).join('');
}
fetch(CONVEX_URL+'/api/songs').then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(data){renderSongs(data)}).catch(function(){var local=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');renderSongs(local)});
function escapeHtml(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
</script>
</body>
</html>
